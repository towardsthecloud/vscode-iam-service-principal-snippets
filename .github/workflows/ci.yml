name: Validate extension
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.24'
          python-version: '3.14.8'
      - run: uv venv && uv pip install -r src/requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python src/update_service_principals.py --check
  extension:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm test
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: vscode-report-${{ matrix.vscode }}
          path: test-results/vscode.json
          if-no-files-found: ignore
  package:
    needs: [catalog, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package -- --out extension.vsix
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-package
          path: extension.vsix
          if-no-files-found: error
