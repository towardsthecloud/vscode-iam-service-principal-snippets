name: Propose documented principal updates
on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 5'
permissions:
  contents: read
concurrency:
  group: service-principal-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.24'
          python-version: '3.14'
      - run: npm ci
      - run: uv venv && uv pip install -r src/requirements.txt
      - name: Check for an existing update proposal
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists=$(gh pr list --state open --json headRefName --jq 'any(.[]; .headRefName | startswith("codex/update-service-principals-"))')
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Fetch and validate documentation
        if: steps.proposal.outputs.exists != 'true'
        run: |
          .venv/bin/python src/update_service_principals.py
          .venv/bin/python src/update_service_principals.py --check
          .venv/bin/python -m unittest discover -s tests -v
          xvfb-run -a npm test
          VSCODE_VERSION=stable xvfb-run -a npm test
          npm run package -- --out extension.vsix
      - name: Open a reviewed update proposal
        if: steps.proposal.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- snippets/service-principals.json; then exit 0; fi
          branch="codex/update-service-principals-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snippets/service-principals.json
          git commit -m 'fix: update documented AWS service principals'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'fix: update documented AWS service principals' --body 'Updates literal principals and their AWS documentation references. Catalog validation, updater regression tests, VS Code minimum/stable integration tests, and VSIX packaging passed before this proposal was opened. Review the catalog diff before merging and release through a version tag.'
